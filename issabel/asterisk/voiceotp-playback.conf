; VoiceOTP Gateway - dedicated Asterisk dialplan context
; File: voiceotp-playback.conf
; Install into the Asterisk custom configuration include directory and include
; it from extensions.conf (or the Issabel/FreePBX custom include mechanism).
;
; This context is isolated: it is not publicly dialable and only processes
; calls originated by the VoiceOTP Gateway via AMI.

[voiceotp-playback]
exten => s,1,NoOp(VoiceOTP playback request)
 same => n,Set(CHANNEL(language)=${VOICEOTP_LANGUAGE})
 same => n,Answer()
 same => n,Wait(0.3)
 same => n,SayDigits(${VOICEOTP_CODE})
 same => n,Hangup()
